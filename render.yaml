services:
  - type: worker
    name: prowl-feature-loader
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: ACCESS_KEY
        sync: false
      - key: SESSION_ID
        sync: false
      - key: VERCEL_RELAY_URL
        value: https://rowl-gules.vercel.app/api/repo
      - key: PROWL_PERSISTENT_DIR
        value: /var/data/prowl
    disk:
      name: prowl-state
      mountPath: /var/data
      sizeGB: 1
